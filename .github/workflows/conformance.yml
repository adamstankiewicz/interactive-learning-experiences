# A2UI conformance: the boundary mapper's surfaces must validate against the
# vendored Google A2UI v1.0 schemas and match their committed goldens.
name: conformance
on:
  pull_request:
  push:
    branches: [main]
jobs:
  a2ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance
