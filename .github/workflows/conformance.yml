# A2UI conformance: the boundary mapper's surfaces must validate against the
# vendored Google A2UI v1.0 schemas and match their committed goldens.
# Standalone workflow while the ci.yml-owning branch stack is in flight;
# fold into ci.yml's verify job after it merges.
name: conformance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  a2ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance
