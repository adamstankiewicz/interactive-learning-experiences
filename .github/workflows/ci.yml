name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR makes the in-flight run obsolete. Runs on main are not
# cancelled — each merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # `next build` typechecks too, and it needs no secrets — verified by
      # building with no .env file present.
      - run: pnpm build
