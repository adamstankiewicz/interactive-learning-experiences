name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR makes the in-flight run obsolete. Runs on main are not
# cancelled — each merged commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # `next build` typechecks too, and it needs no secrets — verified by
      # building with no .env file present.
      - run: pnpm build

      # public/widget-shell.html is a committed build artifact (next build
      # copies public/ before mcp/build.mjs could run, so it can't be built
      # on demand). It goes stale silently when widgets change — the failure
      # mode is "No renderer registered" in every MCP host. The rebuild is
      # byte-deterministic, so a diff means someone forgot `pnpm mcp:build`.
      - name: widget-shell.html is current
        run: |
          node mcp/build.mjs
          git diff --exit-code public/widget-shell.html \
            || { echo '::error::public/widget-shell.html is stale — run `pnpm mcp:build` and commit the result'; exit 1; }
